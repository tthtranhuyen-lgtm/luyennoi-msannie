    <script>
      (function () {
        try {
          // Guard against extensions throwing when window.fetch has only a getter
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && !desc.set && desc.configurable) {
            var _orig = window.fetch.bind(window);
            var _cur = _orig;
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return _cur;
              },
              set: function (fn) {
                _cur = typeof fn === 'function' ? fn : _orig;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {}

        // Global error logger
        window.addEventListener('error', function (e) {
          console.error('[App Init Error]:', e.error || e.message);
          var box = document.getElementById('init-error-display');
          if (box) {
            box.style.display = 'block';
            box.textContent += (e.message || String(e)) + '\n';
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          console.error('[App Rejection]:', e.reason);
          var box = document.getElementById('init-error-display');
          if (box) {
            box.style.display = 'block';
            box.textContent += 'Rejection: ' + (e.reason ? (e.reason.message || String(e.reason)) : 'unknown') + '\n';
          }
        });
      })();
    </script>
